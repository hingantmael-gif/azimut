name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS deps
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK (installable)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/azimut.apk
          ls -lh out/azimut.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azimut-apk
          path: out/azimut.apk

      - name: Publish GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Azimut Android
          body: |
            Installation en 1 clic sur Android :
            1. Télécharge `azimut.apk`
            2. Ouvre le fichier → Installer
            3. L’icône Azimut apparaît comme une app Play Store

            Page simple : https://hingantmael-gif.github.io/azimut/get.html
          files: out/azimut.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
