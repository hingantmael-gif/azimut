<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Azimut" />
    <link rel="icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>Installer Azimut</title>
    <style>
      :root {
        --ink: #07111f;
        --mint: #3dff9a;
        --text: #f4f7fa;
        --muted: rgba(244, 247, 250, 0.72);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(ellipse 80% 50% at 80% -10%, rgba(14, 143, 111, 0.35), transparent),
          radial-gradient(ellipse 60% 40% at 0% 100%, rgba(212, 255, 63, 0.1), transparent),
          var(--ink);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 20px;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
      }
      .icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        display: block;
        margin: 0 auto 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0;
        font-size: 2.4rem;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .tag {
        margin: 10px 0 0;
        color: var(--mint);
        font-weight: 700;
        font-size: 1rem;
      }
      .pitch {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.45;
      }
      .install {
        margin-top: 28px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 16px 18px;
        background: var(--mint);
        color: var(--ink);
        font-size: 1.1rem;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .install:disabled,
      .install[aria-disabled="true"] {
        opacity: 0.55;
        cursor: wait;
      }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
        min-height: 1.4em;
      }
      .meta {
        margin-top: 22px;
        color: rgba(244, 247, 250, 0.45);
        font-size: 0.78rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img class="icon" src="./icon.png" width="96" height="96" alt="Icône Azimut" />
        <h1>Azimut</h1>
        <p class="tag">Coaching multi-sport</p>
        <p class="pitch">Un clic pour installer l’app sur ton téléphone — comme sur le Play Store.</p>
        <a class="install" id="btn" href="#" role="button">Installer Azimut</a>
        <p class="hint" id="hint"></p>
        <p class="meta">Icône = logo Azimut · Gratuit</p>
      </div>
    </main>
    <script>
      (function () {
        var APK = 'https://github.com/hingantmael-gif/azimut/releases/latest/download/azimut.apk';
        var btn = document.getElementById('btn');
        var hint = document.getElementById('hint');
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);

        function setHint(t) { hint.textContent = t || ''; }

        if (isIOS) {
          btn.textContent = 'Ajouter à l’écran d’accueil';
          setHint('Sur iPhone : touche Partager → « Sur l’écran d’accueil ».');
        } else if (isAndroid) {
          btn.textContent = 'Télécharger & installer';
          setHint('Android télécharge le fichier, puis appuie sur Installer.');
        } else {
          btn.textContent = 'Télécharger pour Android';
          setHint('Ouvre ce lien sur un téléphone Android pour installer.');
        }

        btn.addEventListener('click', function (e) {
          e.preventDefault();
          if (isIOS) {
            setHint('Safari → Partager → Sur l’écran d’accueil. L’icône Azimut apparaît comme une app.');
            return;
          }
          btn.setAttribute('aria-disabled', 'true');
          btn.textContent = 'Téléchargement…';
          setHint('Si rien ne se passe, autorise les apps externes pour Chrome / fichiers.');
          window.location.href = APK;
          setTimeout(function () {
            btn.removeAttribute('aria-disabled');
            btn.textContent = isAndroid ? 'Télécharger & installer' : 'Télécharger pour Android';
          }, 2500);
        });
      })();
    </script>
  </body>
</html>
