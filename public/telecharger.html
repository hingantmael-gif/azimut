<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Azimut" />
    <link rel="icon" href="/azimut/icon.png" />
    <link rel="apple-touch-icon" href="/azimut/icon-192.png" />
    <link rel="manifest" id="az-manifest" href="/azimut/manifest.webmanifest?v=9" />
    <title>Installer Azimut</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 85% -5%, rgba(14, 143, 111, 0.35), transparent 55%),
          #07111f;
        color: #f4f7fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(15, 28, 46, 0.95);
        border: 1px solid rgba(61, 255, 154, 0.22);
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
      }
      .logo {
        width: 84px; height: 84px; border-radius: 22px;
        display: block; margin: 0 auto 18px;
        box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      }
      h1 { font-size: 2rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px; }
      .tag { color: #3dff9a; font-weight: 700; margin-bottom: 12px; }
      .desc { color: rgba(244,247,250,0.72); font-size: 0.95rem; line-height: 1.5; margin-bottom: 22px; }
      .qr {
        width: 160px; height: 160px; border-radius: 14px; background: #fff;
        padding: 8px; margin: 0 auto 8px; display: block;
      }
      .qr-caption { color: rgba(244,247,250,0.45); font-size: 0.75rem; margin-bottom: 20px; }
      .btn {
        display: block; width: 100%; padding: 16px 18px; border-radius: 14px;
        font-size: 1.08rem; font-weight: 900; text-decoration: none; border: none;
        cursor: pointer; margin-bottom: 10px;
      }
      .btn-install { background: #3dff9a; color: #07111f; }
      .btn-open { background: transparent; color: #f4f7fa; border: 1px solid rgba(255,255,255,0.2); }
      .btn-apk { background: #111318; color: #f4f7fa; border: 1px solid #252b36; display: none; }
      .btn:disabled { opacity: 0.6; cursor: wait; }
      .status { margin-top: 14px; font-size: 0.86rem; color: rgba(244,247,250,0.7); line-height: 1.45; min-height: 2.8em; }
      .err {
        display: none; margin-top: 12px; text-align: left; padding: 12px 14px;
        border-radius: 12px; background: rgba(255, 80, 80, 0.12);
        border: 1px solid rgba(255, 120, 120, 0.35); color: #ffb4b4;
        font-size: 0.82rem; line-height: 1.45;
      }
      .okbox {
        display: none; margin-top: 12px; text-align: left; padding: 12px 14px;
        border-radius: 12px; background: rgba(61, 255, 154, 0.1);
        border: 1px solid rgba(61, 255, 154, 0.3); color: #b8ffd9;
        font-size: 0.82rem; line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/azimut/icon.png" width="84" height="84" alt="Azimut" />
      <h1>Azimut</h1>
      <p class="tag">Installer l’application</p>
      <p class="desc">
        Un clic pour installer Azimut (icône logo).
        Tu peux désinstaller puis réinstaller autant de fois que tu veux.
      </p>

      <img class="qr" src="/azimut/qr-install.png" width="160" height="160" alt="QR" />
      <p class="qr-caption">Scanne pour installer depuis un téléphone</p>

      <button type="button" class="btn btn-install" id="install-btn">Installer l’application</button>
      <a class="btn btn-open" id="open-btn" href="/azimut/?v=9">Ouvrir Azimut</a>
      <a class="btn btn-apk" id="apk-btn" href="https://github.com/hingantmael-gif/azimut/releases/latest/download/azimut.apk">
        Télécharger l’APK (Android, réinstall illimitée)
      </a>

      <p class="status" id="status">Préparation de l’installateur…</p>
      <div class="err" id="err"></div>
      <div class="okbox" id="okbox"></div>
    </div>

    <script>
      (function () {
        var VERSION = '9';
        var installBtn = document.getElementById('install-btn');
        var statusEl = document.getElementById('status');
        var errEl = document.getElementById('err');
        var okEl = document.getElementById('okbox');
        var apkBtn = document.getElementById('apk-btn');
        var deferredPrompt = null;
        var params = new URLSearchParams(location.search);
        var autoInstall = params.get('autoinstall') === '1';

        var ua = navigator.userAgent || '';
        var isIos = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        if (isAndroid) apkBtn.style.display = 'block';

        function setStatus(t) { statusEl.textContent = t; }
        function showErr(t) {
          errEl.style.display = 'block';
          errEl.textContent = 'Erreur installateur : ' + t;
        }
        function clearErr() {
          errEl.style.display = 'none';
          errEl.textContent = '';
        }
        function showOk(t) {
          okEl.style.display = 'block';
          okEl.textContent = t;
        }

        function standalone() {
          return (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            Boolean(navigator.standalone)
          );
        }

        /** Nettoie SW + caches pour permettre une NOUVELLE install (Chrome bloque sinon). */
        async function resetInstaller() {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
          }
        }

        async function registerSw() {
          if (!('serviceWorker' in navigator)) {
            throw new Error('Ce navigateur ne gère pas les applications installables (Service Worker). Utilise Chrome ou Edge.');
          }
          var reg = await navigator.serviceWorker.register('/azimut/sw.js?v=' + VERSION, {
            scope: '/azimut/',
            updateViaCache: 'none',
          });
          await navigator.serviceWorker.ready;
          return reg;
        }

        function waitForPrompt(ms) {
          if (deferredPrompt) return Promise.resolve(deferredPrompt);
          return new Promise(function (resolve) {
            var done = false;
            function finish() {
              if (done) return;
              done = true;
              window.removeEventListener('beforeinstallprompt', onBIP);
              resolve(deferredPrompt);
            }
            function onBIP(e) {
              e.preventDefault();
              deferredPrompt = e;
              finish();
            }
            window.addEventListener('beforeinstallprompt', onBIP);
            setTimeout(finish, ms);
          });
        }

        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredPrompt = e;
          setStatus('Installateur prêt — tu peux installer (et réinstaller après désinstall).');
          clearErr();
        });

        window.addEventListener('appinstalled', function () {
          deferredPrompt = null;
          installBtn.textContent = 'Installé ✓';
          showOk('Installation réussie. Tu peux ouvrir Azimut, ou plus tard le désinstaller puis réinstaller via ce même bouton.');
          setStatus('Application installée.');
        });

        async function runNativeInstall() {
          clearErr();
          if (standalone()) {
            setStatus('Déjà ouvert en application. Utilise Ouvrir Azimut, ou désinstalle puis réinstalle.');
            location.href = '/azimut/?v=' + VERSION;
            return;
          }
          if (isIos) {
            setStatus('iPhone : Safari → Partager → Sur l’écran d’accueil.');
            return;
          }

          installBtn.disabled = true;
          installBtn.textContent = 'Préparation…';
          setStatus('Réinitialisation de l’installateur (pour permettre une nouvelle install)…');

          try {
            // Toujours reset avant install → réinstall possible N fois
            await resetInstaller();
            await registerSw();

            // Sans contrôleur, Chrome n’envoie parfois pas le prompt → 1 reload auto
            if (!navigator.serviceWorker.controller && !sessionStorage.getItem('az-ctl-' + VERSION)) {
              sessionStorage.setItem('az-ctl-' + VERSION, '1');
              setStatus('Activation de l’installateur…');
              location.replace('/azimut/telecharger.html?autoinstall=1&v=' + VERSION + '&t=' + Date.now());
              return;
            }

            setStatus('Recherche de la fenêtre d’installation…');
            var promptEvent = await waitForPrompt(5000);

            if (!promptEvent) {
              // 2ᵉ chance : reload autoinstall une seule fois
              if (!sessionStorage.getItem('az-retry-' + VERSION)) {
                sessionStorage.setItem('az-retry-' + VERSION, '1');
                setStatus('Nouvel essai de l’installateur…');
                location.replace('/azimut/telecharger.html?autoinstall=1&v=' + VERSION + '&t=' + Date.now());
                return;
              }
              installBtn.disabled = false;
              installBtn.textContent = 'Installer l’application';
              var msg =
                'Chrome n’a pas proposé la fenêtre native (souvent s’il croit que l’app est encore installée). ' +
                'Va dans chrome://apps ou le menu ⋮ → Applications, désinstalle Azimut, puis reclique Installer. ' +
                'En attendant, « Ouvrir Azimut » fonctionne.';
              if (isAndroid) {
                msg += ' Sur Android tu peux aussi utiliser « Télécharger l’APK » (réinstall illimitée).';
              }
              showErr(msg);
              setStatus('Installateur bloqué par le navigateur — voir le détail ci-dessous.');
              return;
            }

            installBtn.textContent = 'Installation…';
            setStatus('Fenêtre d’installation ouverte…');
            await promptEvent.prompt();
            var choice = await promptEvent.userChoice;
            deferredPrompt = null;
            installBtn.disabled = false;
            installBtn.textContent = 'Installer l’application';
            if (choice.outcome === 'accepted') {
              showOk('Installé. Pour réinstaller plus tard : désinstalle Azimut, reviens ici, reclique Installer.');
              setStatus('Succès.');
            } else {
              setStatus('Installation annulée — tu peux réessayer quand tu veux.');
            }
          } catch (e) {
            installBtn.disabled = false;
            installBtn.textContent = 'Installer l’application';
            showErr((e && e.message) ? e.message : String(e));
            setStatus('Échec — l’erreur est affichée ci-dessous.');
          }
        }

        installBtn.addEventListener('click', function () {
          // Nouveau cycle de réinstall à chaque clic manuel
          sessionStorage.removeItem('az-ctl-' + VERSION);
          sessionStorage.removeItem('az-retry-' + VERSION);
          runNativeInstall();
        });

        // Boot
        if (standalone()) {
          installBtn.textContent = 'Déjà installé — Ouvrir';
          setStatus('Application déjà installée sur cet appareil.');
          installBtn.addEventListener('click', function () {
            location.href = '/azimut/?v=' + VERSION;
          }, { once: true });
        } else {
          registerSw()
            .then(function () {
              setStatus('Installateur prêt. Clique « Installer l’application » (réutilisable après désinstall).');
              if (autoInstall) runNativeInstall();
            })
            .catch(function (e) {
              showErr((e && e.message) ? e.message : String(e));
              setStatus('Installateur non prêt — tu peux quand même Ouvrir Azimut.');
            });
        }
      })();
    </script>
  </body>
</html>
