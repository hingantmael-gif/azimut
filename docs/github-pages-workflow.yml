# Deploy Azimut (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Export web (PWA)
        run: npx expo export --platform web
      - name: Ensure PWA assets in dist
        run: |
          mkdir -p dist
          cp -f public/manifest.webmanifest dist/ 2>/dev/null || true
          cp -f public/sw.js dist/ 2>/dev/null || true
          cp -f public/icon.png dist/ 2>/dev/null || true
          cp -f public/favicon.png dist/ 2>/dev/null || true
          if [ -f dist/index.html ]; then cp -f dist/index.html dist/404.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
